<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181a">
<title>Metal HIIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ebed; --panel:#ffffff; --ink:#16181a; --muted:#5d656c; --line:#c9ced3;
  --work:#c8102e; --rest:#2f6aa8; --prep:#b8860b; --chrome:#8a939b;
  --field:#f4f5f6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181a; --panel:#202427; --ink:#e6e9ec; --muted:#9aa3ab; --line:#353b40;
    --work:#e0203d; --rest:#4a8ad0; --prep:#d9a21b; --chrome:#8a939b; --field:#2a2f33;
  }
}
:root[data-theme="dark"]{
  --bg:#16181a; --panel:#202427; --ink:#e6e9ec; --muted:#9aa3ab; --line:#353b40;
  --work:#e0203d; --rest:#4a8ad0; --prep:#d9a21b; --chrome:#8a939b; --field:#2a2f33;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1{font-family:"Metal Mania","Impact",fantasy;font-weight:400;font-size:clamp(2.6rem,11vw,3.6rem);
  line-height:1;margin:8px 0 4px;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 22px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 12px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.88rem;color:var(--muted);font-weight:600}
input[type=number],select,textarea{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--line);
  background:var(--field);color:var(--ink);font:inherit;font-size:1rem}
textarea{min-height:110px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--work)}
.row{display:flex;align-items:center;gap:10px;margin-top:10px}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--work)}
.row label{color:var(--ink);font-weight:400;font-size:.95rem}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;
  background:var(--field);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--prep);outline-offset:2px}
.primary{width:100%;background:var(--work);color:#fff;border:0;font-family:"Big Shoulders Display","sans-serif-condensed",Impact,sans-serif;
  font-weight:900;font-size:1.7rem;padding:14px;letter-spacing:.04em}
.filebtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:2px dashed var(--chrome);
  border-radius:10px;cursor:pointer;font-weight:700;color:var(--ink)}
.filebtn input{display:none}
#tracks{list-style:none;margin:10px 0 0;padding:0;max-height:160px;overflow:auto;font-size:.92rem}
#tracks li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
#tracks li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary{text-align:center;color:var(--muted);margin:6px 0 12px;font-weight:600}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}

/* Pantalla de entrenamiento */
#run{position:fixed;inset:0;display:none;flex-direction:column;background:var(--prep);color:#fff;
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));transition:background-color .25s}
#run.show{display:flex}
#run.work{background:var(--work)} #run.rest{background:var(--rest)} #run.prep{background:var(--prep)}
#run.done{background:#16181a}
.top{display:flex;justify-content:space-between;font-weight:700;font-size:1rem;opacity:.92}
.phase{font-family:"Big Shoulders Display","sans-serif-condensed",Impact,sans-serif;font-weight:900;font-size:clamp(2.2rem,10vw,3.4rem);
  line-height:1;margin-top:18px;text-align:center}
.exname{text-align:center;font-size:1.3rem;font-weight:600;margin-top:6px;min-height:1.6em}
.clock{flex:1;display:flex;align-items:center;justify-content:center;font-family:"Big Shoulders Display","sans-serif-condensed",Impact,sans-serif;
  font-weight:900;font-size:min(62vw,46vh);line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
.bar div{height:100%;width:0;background:#fff}
.next{text-align:center;margin:10px 0 4px;font-weight:600;opacity:.9;min-height:1.4em}
.track{text-align:center;font-size:.85rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:12px}
.controls button{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:1.05rem;padding:14px 6px}
@media (prefers-reduced-motion:reduce){#run{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Metal HIIT</h1>
  <p class="sub">Tu música, tu rutina, un locutor que te cuenta cada segundo.</p>

  <section>
    <h2>Tu música</h2>
    <label class="filebtn">🎸 Cargar canciones del celular
      <input id="files" type="file" accept="audio/*" multiple>
    </label>
    <ul id="tracks"></ul>
    <div class="row"><input type="checkbox" id="shuffle" checked><label for="shuffle">Orden aleatorio</label></div>
    <div style="margin-top:12px"><label for="vol">Volumen de la música</label><input type="range" id="vol" min="0" max="100" value="85"></div>
    <div style="margin-top:10px"><label for="restVol">Música en el descanso (% del volumen)</label><input type="range" id="restVol" min="0" max="100" value="45"></div>
    <p class="hint">La música baja sola cada vez que habla la voz, para que siempre la escuches.</p>
  </section>

  <section>
    <h2>Rutina</h2>
    <div class="grid">
      <label>Trabajo (seg)<input type="number" id="work" min="5" max="300" value="40"></label>
      <label>Descanso (seg)<input type="number" id="rest" min="5" max="300" value="20"></label>
      <label>Ejercicios por serie<input type="number" id="ex" min="1" max="20" value="5"></label>
      <label>Series<input type="number" id="rounds" min="1" max="20" value="4"></label>
      <label>Preparación (seg)<input type="number" id="prep" min="8" max="60" value="10"></label>
      <label>Descanso extra entre series<input type="number" id="roundRest" min="0" max="300" value="0"></label>
    </div>
    <div style="margin-top:12px">
      <label for="names">Nombres de los ejercicios (uno por línea, opcional)</label>
      <textarea id="names" placeholder="Burpees&#10;Sentadilla con salto&#10;Mountain climbers&#10;Flexiones&#10;Jumping jacks"></textarea>
    </div>
  </section>

  <section>
    <h2>Voz de locutor metal</h2>
    <p class="hint" id="voiceStatus" style="margin:0 0 10px">Preparando la voz…</p>
    <div id="nativeVoice">
      <label for="intensity">Intensidad (más alto = más grave y distorsionada)</label>
      <input type="range" id="intensity" min="0" max="100" value="70">
      <button id="regen" style="margin-top:10px;width:100%">Aplicar intensidad</button>
      <div style="margin-top:12px"><label for="voiceVol">Volumen de la voz</label><input type="range" id="voiceVol" min="20" max="100" value="100"></div>
    </div>
    <div id="webVoice">
      <label for="voice">Voz en inglés</label>
      <select id="voice"></select>
      <div style="margin-top:12px"><label for="pitch">Tono (más bajo = más rudo)</label><input type="range" id="pitch" min="0" max="20" value="6"></div>
    </div>
    <div class="row"><input type="checkbox" id="announce" checked><label for="announce">Anunciar el siguiente ejercicio en el descanso</label></div>
    <div class="row"><input type="checkbox" id="lastRound" checked><label for="lastRound">Avisar "Last round!" antes de la última serie</label></div>
    <div class="row"><input type="checkbox" id="hit" checked><label for="hit">Golpe de batería en cada Go y Stop</label></div>
    <button id="testVoice" style="margin-top:12px;width:100%">Probar voz</button>
  </section>

  <p class="summary" id="summary"></p>
  <button class="primary" id="start">START</button>
</div>

<div id="run" class="prep" aria-live="polite">
  <div class="top"><span id="roundLbl"></span><span id="leftLbl"></span></div>
  <div class="phase" id="phaseLbl">GET READY</div>
  <div class="exname" id="exLbl"></div>
  <div class="clock" id="clock">10</div>
  <div class="bar"><div id="barFill"></div></div>
  <div class="next" id="nextLbl"></div>
  <div class="track" id="trackLbl"></div>
  <div class="controls">
    <button id="quit">Salir</button>
    <button id="pause">Pausa</button>
    <button id="skip">Saltar</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const NATIVE = !!window.Android;
const fields = ["work","rest","ex","rounds","prep","roundRest","names","vol","restVol","pitch","intensity","voiceVol"];
const checks = ["shuffle","announce","hit","lastRound"];
$(NATIVE ? "webVoice" : "nativeVoice").style.display = "none";

/* ---------- Ajustes guardados ---------- */
function loadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem("metalhiit") || "{}");
    fields.forEach(f => { if (s[f] !== undefined) $(f).value = s[f]; });
    checks.forEach(f => { if (s[f] !== undefined) $(f).checked = s[f]; });
    if (s.voice) window._savedVoice = s.voice;
  }catch(e){}
}
function saveSettings(){
  try{
    const s = {}; fields.forEach(f => s[f] = $(f).value); checks.forEach(f => s[f] = $(f).checked);
    s.voice = $("voice").value;
    localStorage.setItem("metalhiit", JSON.stringify(s));
  }catch(e){}
}
const num = (id, min) => Math.max(min, parseInt($(id).value) || min);
const exNames = () => $("names").value.split("\n").map(s => s.trim()).filter(Boolean);

function updateSummary(){
  const w=num("work",5), r=num("rest",5), e=num("ex",1), n=num("rounds",1), rr=num("roundRest",0);
  const total = w*e*n + r*(e*n-1) + rr*(n-1);
  const m = Math.floor(total/60), s = total%60;
  $("summary").textContent = `${n} series × ${e} ejercicios · ${m} min${s?` ${s} s`:""} de entrenamiento`;
}

/* ---------- Música ---------- */
let tracks = [], order = [], tPos = 0;
const audio = new Audio(); audio.preload = "auto";
let ctx, musicGain;
function ensureAudio(){
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaElementSource(audio);
  musicGain = ctx.createGain();
  src.connect(musicGain).connect(ctx.destination);
}
$("files").addEventListener("change", e => {
  for (const f of e.target.files) tracks.push({ name: (f.name || "Canción").replace(/\.[^.]+$/,""), url: URL.createObjectURL(f) });
  renderTracks(); e.target.value = "";
});
function renderTracks(){
  const ul = $("tracks"); ul.innerHTML = "";
  tracks.forEach((t,i) => {
    const li = document.createElement("li");
    const sp = document.createElement("span"); sp.textContent = t.name;
    const b = document.createElement("button"); b.textContent = "✕"; b.setAttribute("aria-label","Quitar "+t.name);
    b.style.padding = "2px 10px";
    b.onclick = () => { URL.revokeObjectURL(t.url); tracks.splice(i,1); renderTracks(); };
    li.append(sp,b); ul.append(li);
  });
}
function buildOrder(){
  order = tracks.map((_,i)=>i);
  if ($("shuffle").checked) for (let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  tPos = 0;
}
function playTrack(){
  if (!tracks.length) { $("trackLbl").textContent = "Sin música cargada"; return; }
  const t = tracks[order[tPos % order.length]];
  audio.src = t.url; audio.play().catch(()=>{});
  $("trackLbl").textContent = "♪ " + t.name;
}
audio.addEventListener("ended", () => { tPos++; playTrack(); });
audio.addEventListener("error", () => { if (running && tracks.length > 1) { tPos++; playTrack(); } });

let phaseLevel = 1, ducked = false, duckTimer = null;
function applyLevel(){
  if (!musicGain) return;
  const base = num("vol",0)/100 * phaseLevel * (ducked ? 0.3 : 1);
  musicGain.gain.setTargetAtTime(base, ctx.currentTime, 0.06);
}
function duck(ms){
  ducked = true; applyLevel(); clearTimeout(duckTimer);
  duckTimer = setTimeout(() => { ducked = false; applyLevel(); }, ms + 150);
}

/* ---------- Voz ---------- */
const TEXT = { ready:"Are you ready?", "5":"Five","4":"Four","3":"Three","2":"Two","1":"One", go:"Go!", stop:"Stop!",
  round:"Round complete!", last:"Last round!", next:"Next!", done:"Workout complete! You crushed it!" };

let voices = [];
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  const sel = $("voice"); sel.innerHTML = "";
  voices.forEach(v => { const o=document.createElement("option"); o.value=v.name; o.textContent=`${v.name} (${v.lang})`; sel.append(o); });
  if (window._savedVoice && voices.some(v=>v.name===window._savedVoice)) sel.value = window._savedVoice;
}
if (!NATIVE && "speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function webSay(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(v => v.name === $("voice").value); if (v) u.voice = v;
  u.lang = v ? v.lang : "en-US"; u.pitch = num("pitch",0)/10; u.rate = 1.05;
  speechSynthesis.speak(u); duck(900);
}
/* key: frase fija o "n:Nombre" para ejercicios. Devuelve ms. */
function speak(key){
  if (NATIVE){
    const ms = Android.cue(key);
    if (ms > 0) duck(ms);
    return ms > 0 ? ms : 0;
  }
  webSay(key.startsWith("n:") ? key.slice(2) : TEXT[key]); return 700;
}
function speakNext(name){
  const ms = speak("next");
  setTimeout(() => { if (running && !paused) speak("n:" + name); }, Math.max(350, ms - 100));
}

function voiceState(){ return NATIVE ? Android.voiceStatus() : "ready"; }
function showVoiceStatus(){
  const st = voiceState(), el = $("voiceStatus");
  if (st === "ready") el.textContent = NATIVE ? "Voz lista 🤘" : "Usando la voz del navegador.";
  else if (st === "loading") el.textContent = "Preparando la voz metal… (solo tarda la primera vez)";
  else if (st === "error:english") el.innerHTML = 'Tu teléfono no tiene voz en inglés. <a href="#" id="ttsLink">Abrir ajustes de voz</a> e instala inglés en "Servicios de voz de Google".';
  else el.innerHTML = 'No se encontró un motor de voz. Instala "Servicios de voz de Google" desde Play Store. <a href="#" id="ttsLink">Abrir ajustes de voz</a>';
  const l = $("ttsLink"); if (l) l.onclick = e => { e.preventDefault(); Android.openTtsSettings(); };
  $("start").disabled = st === "loading";
  $("start").textContent = st === "loading" ? "PREPARANDO VOZ…" : "START";
}
setInterval(() => { if (!running) showVoiceStatus(); }, 700);
if (NATIVE){
  Android.setVoiceVolume(num("voiceVol",20)/100);
  $("voiceVol").addEventListener("input", () => Android.setVoiceVolume(num("voiceVol",20)/100));
  $("regen").onclick = () => { saveSettings(); Android.regenerate(num("intensity",0)/100); showVoiceStatus(); };
}

/* Golpe de bombo + platillo sintetizado */
function hit(){
  if (!$("hit").checked || !ctx) return;
  const t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(42,t+0.25);
  g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.42);
  const len = ctx.sampleRate*0.6, buf = ctx.createBuffer(1,len,ctx.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len,3);
  const n = ctx.createBufferSource(); n.buffer = buf;
  const hp = ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value = 5000;
  const ng = ctx.createGain(); ng.gain.value = 0.35;
  n.connect(hp).connect(ng).connect(ctx.destination); n.start(t);
}

/* ---------- Secuencia ---------- */
let seq = [], idx = 0, phaseEnd = 0, lastSec = null, running = false, paused = false, pauseRemain = 0, timer = null;
function buildSeq(){
  const w=num("work",5), r=num("rest",5), e=num("ex",1), n=num("rounds",1), rr=num("roundRest",0), names=exNames();
  seq = [{type:"prep", dur:num("prep",8)}];
  for (let ri=0; ri<n; ri++) for (let ei=0; ei<e; ei++){
    const name = names.length ? names[ei % names.length] : "";
    seq.push({type:"work", dur:w, round:ri+1, ex:ei+1, name});
    const last = ri===n-1 && ei===e-1;
    if (!last) seq.push({type:"rest", dur: r + (ei===e-1 ? rr : 0), round:ri+1, ex:ei+1, endsRound: ei===e-1});
  }
  seq.forEach((p,i) => { if (p.type!=="work"){ const nx = seq.slice(i+1).find(q=>q.type==="work"); if (nx){ p.nextName = nx.name; p.nextIsLastRound = nx.round===n && nx.ex===1 && n>1; } } });
}
const totalRemaining = () => seq.slice(idx+1).reduce((a,p)=>a+p.dur,0) + Math.max(0,(phaseEnd-performance.now())/1000);

function startPhase(i){
  idx = i; const p = seq[i];
  phaseEnd = performance.now() + p.dur*1000; lastSec = null;
  $("run").className = "show " + p.type;
  if (p.type==="prep"){ $("phaseLbl").textContent="GET READY"; $("exLbl").textContent=""; $("roundLbl").textContent=""; phaseLevel=0.8; speak("ready"); }
  if (p.type==="work"){ $("phaseLbl").textContent="GO!"; $("exLbl").textContent=p.name || `Ejercicio ${p.ex}`;
    $("roundLbl").textContent=`Serie ${p.round} · Ejercicio ${p.ex}`; phaseLevel=1; speak("go"); hit(); }
  if (p.type==="rest"){ $("phaseLbl").textContent="DESCANSO"; $("exLbl").textContent="Respira";
    phaseLevel=num("restVol",0)/100; speak("stop"); hit();
    if (p.endsRound) setTimeout(() => { if (running && idx===i) speak("round"); }, 1100);
    if (p.nextIsLastRound && $("lastRound").checked) setTimeout(() => { if (running && idx===i) speak("last"); }, p.endsRound ? 2600 : 1400);
  }
  $("nextLbl").textContent = p.nextName ? "Sigue: " + p.nextName : "";
  applyLevel(); tick();
}
function onSecond(p, s){
  if (p.type==="prep" && s<=5 && s<p.dur) speak(String(s));
  if (p.type==="work" && s<=3 && s<p.dur) speak(String(s));
  if (p.type==="rest"){
    if (s<=5 && s<p.dur) speak(String(s));
    else if ($("announce").checked && p.nextName && p.dur>=12 && s===Math.min(p.dur-4, 10)) speakNext(p.nextName);
  }
}
function tick(){
  if (!running || paused) return;
  const rem = (phaseEnd - performance.now())/1000;
  if (rem <= 0){ return idx+1 < seq.length ? startPhase(idx+1) : finish(); }
  const s = Math.ceil(rem), p = seq[idx];
  if (s !== lastSec){ lastSec = s; onSecond(p, s); }
  $("clock").textContent = s;
  $("barFill").style.width = ((1 - rem/p.dur)*100) + "%";
  const tr = Math.ceil(totalRemaining()); $("leftLbl").textContent = `${Math.floor(tr/60)}:${String(tr%60).padStart(2,"0")} restante`;
}

function waitVoice(){
  return new Promise(res => {
    const t0 = Date.now();
    const chk = () => (voiceState() !== "loading" || Date.now()-t0 > 15000) ? res() : setTimeout(chk, 200);
    chk();
  });
}
$("start").onclick = async () => {
  saveSettings(); ensureAudio(); await ctx.resume();
  if (NATIVE && exNames().length && $("announce").checked){
    Android.prepareNames(JSON.stringify(exNames()));
    $("start").disabled = true; $("start").textContent = "PREPARANDO VOZ…";
    await waitVoice();
  }
  buildSeq(); buildOrder(); running = true; paused = false; $("pause").textContent = "Pausa";
  phaseLevel = 0.8; applyLevel(); playTrack();
  startPhase(0); clearInterval(timer); timer = setInterval(tick, 100);
};
$("pause").onclick = () => {
  if (!running) return;
  if (!paused){ paused = true; pauseRemain = phaseEnd - performance.now(); audio.pause(); if (!NATIVE && window.speechSynthesis) speechSynthesis.cancel(); $("pause").textContent = "Seguir"; }
  else { paused = false; phaseEnd = performance.now() + pauseRemain; if (tracks.length) audio.play().catch(()=>{}); $("pause").textContent = "Pausa"; }
};
$("skip").onclick = () => { if (running && !paused){ idx+1 < seq.length ? startPhase(idx+1) : finish(); } };
$("quit").onclick = stopAll;
function finish(){
  running = false; clearInterval(timer);
  $("run").className = "show done";
  $("phaseLbl").textContent = "DONE"; $("exLbl").textContent = "Entrenamiento completo 🤘"; $("clock").textContent = "🤘";
  $("nextLbl").textContent = ""; $("barFill").style.width = "100%"; $("leftLbl").textContent = "";
  hit(); speak("done");
  phaseLevel = 0.5; applyLevel();
  setTimeout(() => { if (!running && musicGain){ musicGain.gain.setTargetAtTime(0, ctx.currentTime, 1.5); setTimeout(()=>{ if(!running) audio.pause(); }, 6000); } }, 4000);
}
function stopAll(){
  running = false; paused = false; clearInterval(timer); audio.pause();
  if (!NATIVE && window.speechSynthesis) speechSynthesis.cancel();
  $("run").className = ""; $("pause").textContent = "Pausa";
}
/* Botón atrás de Android: detiene el entrenamiento en vez de cerrar la app */
window.androidBack = () => { if ($("run").classList.contains("show")) { stopAll(); return true; } return false; };

$("testVoice").onclick = async () => {
  ensureAudio(); await ctx.resume(); saveSettings(); hit();
  const seqT = ["ready","5","4","3","2","1","go"]; let t = 0;
  seqT.forEach((k,i) => { setTimeout(() => speak(k), t); t += i===0 ? 1800 : 1000; });
};
[...fields, ...checks, "voice"].forEach(f => $(f).addEventListener("change", () => { saveSettings(); updateSummary(); }));
$("vol").addEventListener("input", applyLevel);
loadSettings(); updateSummary(); showVoiceStatus();
</script>
